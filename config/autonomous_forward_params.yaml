autonomous_forward_node:
  ros__parameters:
    # Goal generation (arena: x=[-0.5,5.5] y=[-2,2] z=[1.0,1.2])
    forward_distance: 1.0          # Meters ahead to place each goal
    goal_height: 1.5               # Flight height (workspace z: 1.0-1.2m)
    lateral_variation: 0.25         # Random lateral offset range (meters)

    # Timing (seconds)
    command_interval_min: 30       # Min time between commands
    command_interval_max: 60       # Max time between commands
    max_wait_time: 60              # Max wait if system not idle

    # Safety
    land_probability: 0.0          # Probability of random landing (0 = never)
    max_consecutive_failures: 3    # Emergency land after N failures
