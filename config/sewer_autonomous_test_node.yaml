sewer_autonomous_test_node:
  ros__parameters:

    # ------------------------------------------------------------------
    # Entry / exit waypoint
    # ------------------------------------------------------------------
    # Name of a TF frame to reach BEFORE starting the vertical descent
    # exploration, and to return to when the exploration is finished or
    # too many failures have occurred.
    # Set to "" to skip both the approach and return phases (legacy
    # behaviour: take off from spawn and ascend to z=5 on completion).
    entry_frame: "sewer_entry"

    # If true, fly back to entry_frame before landing when exploration
    # finishes or on max-failure bail-out.
    return_to_entry: false

    # ------------------------------------------------------------------
    # Timing
    # ------------------------------------------------------------------
    # Min/max wait between autonomous commands [s]
    command_interval_min: 30
    command_interval_max: 45

    # Max time to wait for the current command to complete before
    # forcibly sending a new one [s]
    max_wait_time: 60

    # Probability [0-1] of randomly issuing a land command instead of
    # an exploration flyto. Set to 0 for pure exploration.
    land_probability: 0.0

    # Number of consecutive failures before triggering return/land
    max_consecutive_failures: 3


    # ------------------------------------------------------------------
    # Sewer geometry
    # ------------------------------------------------------------------
    # Maximum downward distance searched for free frontier nodes [m]
    max_descent_distance: 3.0

    # Exploration parameters
    max_goal_distance: 3.0      # Reduced maximum radius for tight sewer environment
    goal_distance_ratio: 0.30   # Spawn goal closer to current position (30% of max distance)
    min_forward_space: 0.8      # Reduced minimum forward space required for sewer
    lateral_randomness: 0.3     # Tight randomness for narrow sewer spaces

    # Minimum free depth below the drone needed to trigger a descent [m]
    min_descent_space: 0.5

    # Maximum lateral (XY) distance from the drone to consider free
    # octomap nodes as part of the tunnel [m]
    tunnel_radius: 2.0

    # Minimum altitude in the 'map' TF frame before the drone returns
    # to sewer_entry. In the sewer simulation, map Z=0 = Gazebo ground level,
    # so this value directly represents the height above the sewer floor [m].
    min_altitude_map: 0.7

    # Minimum Z in the PX4 odom ENU frame (Z=0 at spawn, negative going down)
    # that triggers a return to sewer_entry. Used as primary floor check.
    # Formula: -(spawn_z_gazebo - floor_z_gazebo - safety_margin)
    #          = -(5.8 - 0 - 0.5) = -5.3m  [theoretical]
    # Observed effective floor in simulation: ~-4.7m (tube structure at ~Z=1.1m inside)
    # Default: -4.5m (conservative, 0.2m above observed floor).
    min_z_odom: -4.5
