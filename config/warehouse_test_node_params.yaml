warehouse_test_node:
  ros__parameters:
    # Timing parameters (in seconds)
    command_interval_min: 120    # Minimum time between commands (2 minutes)
    command_interval_max: 180    # Maximum time between commands (3 minutes)
    max_wait_time: 60           # Max time to wait if system is not idle (1 minute)
    
    # Command probabilities
    land_probability: 0.0      # 3% chance of sending land command to disable random landing during exploration testing
    max_consecutive_failures: 3 # Emergency land after this many consecutive failures
    
    # Exploration parameters
    max_goal_distance: 8.0      # Reduced maximum radius for exploration step to keep goals closer
    goal_distance_ratio: 0.8    # Ratio of max distance to spawn goal (0.5 = halfway)
    min_forward_space: 1.5      # Minimum forward space required, otherwise return to start
    lateral_randomness: 1.0     # Wide randomness for large open spaces (Leonardo Race)
    random_dir_prob: 0.40       # 40% chance to explore a frontier in a completely random direction
    random_node_prob: 0.40      # 40% chance to wander to a random known free node