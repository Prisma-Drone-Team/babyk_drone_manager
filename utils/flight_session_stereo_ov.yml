session_name: flight_session_stereo_ov
environment:
  ROS_DOMAIN_ID: "23"
options:
  mouse: 'on'

shell_command_before:
  - source /root/ros2_ws/install/setup.bash

windows:
  - window_name: main_nodes
    layout: tiled
    panes:
      # --- [Pane 1] VIO (Single OpenVINS instance processing both cameras) ---
      - shell_command:
          - sleep 3
          - ros2 launch openvins_bringup launch_openvins_multicam.launch.py  # config_path:=/root/ros2_ws/src/pkg/openvins_bringup/config/new_kalibr/estimator_config_multicam.yaml
      
      # --- [Pane 2] Odometry Tracking Stack (Direct ENU Converter + px4_tf_pub, NO EKF) ---
      - shell_command:
          - sleep 6
          - ros2 launch odometry_tracker odometry_tracker_enu_direct.launch.py input_odom_topic:=/ov_msckf/odomimu

      # --- [Pane 3] MicroXRCE-DDS Agent ---
      - shell_command:
          - sleep 10
          - MicroXRCEAgent serial --dev /dev/ttyUSB0 -b 921600

      # --- [Pane 4] Empty Pane ---
      - shell_command:
          - sleep 5

  - window_name: drivers
    layout: tiled
    panes:
      # --- [Pane 1] Front Camera Driver (cam0) ---
      - shell_command:
          - ros2 launch realsense2_camera rs_launch.py camera_name:=cam0 serial_no:="'142122110055'" enable_fisheye1:=true enable_fisheye2:=true enable_pose:=false enable_gyro:=true enable_accel:=true unite_imu_method:="2" publish_tf:=false tf_publish_rate:=0.0

      # --- [Pane 2] Back Camera Driver (cam1) ---
      # We don't strictly need IMU here because openvins only listens to /cam0/imu, but it doesn't hurt to have it running.
      - shell_command:
          - ros2 launch realsense2_camera rs_launch.py camera_name:=cam1 serial_no:="'146322110430'" enable_fisheye1:=true enable_fisheye2:=true enable_pose:=false enable_gyro:=true enable_accel:=true unite_imu_method:="2" publish_tf:=false tf_publish_rate:=0.0
