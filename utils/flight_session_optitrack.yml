session_name: flight_session_optitrack
environment:
  ROS_DOMAIN_ID: "23"
options:
  mouse: 'on'

shell_command_before:
  - source /root/ros2_ws/install/setup.bash

windows:
  - window_name: main_nodes
    layout: tiled
    panes:
      # --- [Pane 1] VIO (OpenVINS) ---
      - shell_command:
          - sleep 3
          - ros2 launch openvins_bringup launch_openvins_back.launch.py
      
      # --- [Pane 2] Odometry Tracking Stack (ENU version, NO PX4 FEED) ---
      # Remapping /fmu/in/vehicle_visual_odometry to dummy to avoid interfering with OptiTrack
      - shell_command:
          - sleep 6
          - ros2 run odometry_tracker odom_to_baselink_enu_direct

      # --- [Pane 3] MicroXRCE-DDS Agent ---
      - shell_command:
          - sleep 10
          - MicroXRCEAgent serial --dev /dev/ttyUSB0 -b 921600

      # --- [Pane 4] ROS 2 Bag Record ---
      - shell_command:
          - sleep 15
          # - cd /root/ros2_ws/src/pkg/babyk_drone_manager
          # - ros2 bag record
          #   /cam0/fisheye1/image_raw
          #   /cam1/accel/imu_info
          #   /cam1/accel/metadata
          #   /cam1/accel/sample
          #   /cam1/fisheye1/camera_info
          #   /cam1/fisheye1/image_raw
          #   /cam1/fisheye1/metadata
          #   /cam1/fisheye2/camera_info
          #   /cam1/fisheye2/image_raw
          #   /cam1/fisheye2/metadata
          #   /cam1/gyro/imu_info
          #   /cam1/gyro/metadata
          #   /cam1/gyro/sample
          #   /cam1/imu
          #   /fmu/in/vehicle_visual_odometry
          #   /fmu/out/vehicle_odometry
          #   /optitrack/body_3/odometry
          #   /tf
          #   /tf_static

  - window_name: drivers
    layout: tiled
    panes:
      # --- [Pane 1] Front Camera Driver (cam0) ---
      - shell_command:
          #- ros2 launch realsense2_camera rs_launch.py camera_name:=cam0 serial_no:="'146322110182'" enable_fisheye1:=true enable_fisheye2:=true enable_pose:=false enable_gyro:=true enable_accel:=true unite_imu_method:="2" publish_tf:=false tf_publish_rate:=0.0

      # --- [Pane 2] Back Camera Driver (cam1) ---
      - shell_command:
          - ros2 launch realsense2_camera rs_launch.py camera_name:=cam1 serial_no:="'146322110430'" enable_fisheye1:=true enable_fisheye2:=true enable_pose:=false enable_gyro:=true enable_accel:=true unite_imu_method:="2" publish_tf:=false tf_publish_rate:=0.0
