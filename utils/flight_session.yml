session_name: vio_flight_stack
environment:
  ROS_DOMAIN_ID: "23"
options:
  mouse: 'on'

shell_command_before:
  - source /root/ros2_ws/install/setup.bash

windows:
  - window_name: algorithms
    layout: tiled
    panes:
      # --- [Pane 1] Dual OpenVINS (front + back) ---
      - shell_command:
          - sleep 3
          - ros2 launch openvins_bringup launch_openvins_dual.launch.py

      # --- [Pane 2] RViz2 Visualization ---
      - shell_command:
          - sleep 5
          - ros2 run rviz2 rviz2 -d $(ros2 pkg prefix openvins_bringup)/share/openvins_bringup/config/flight.rviz

      # --- [Pane 3] Odometry Tracking Stack ---
      - shell_command:
          - sleep 6
          - ros2 launch odometry_tracker odometry_tracker.launch.py

      # --- [Pane 5] Empty Pane ---
      - shell_command:
          - sleep 5

  - window_name: drivers
    layout: tiled
    panes:
      # --- [Pane 1] Front Camera Driver (cam0) ---
      - shell_command:
          - ros2 launch realsense2_camera rs_launch.py camera_name:=cam0 serial_no:="'146322110182'" enable_fisheye1:=true enable_fisheye2:=true enable_pose:=false enable_gyro:=true enable_accel:=true unite_imu_method:="2" publish_tf:=false tf_publish_rate:=0.0

      # --- [Pane 2] Back Camera Driver (cam1) ---
      - shell_command:
          - ros2 launch realsense2_camera rs_launch.py camera_name:=cam1 serial_no:="'146322110430'" enable_fisheye1:=true enable_fisheye2:=true enable_pose:=false enable_gyro:=true enable_accel:=true unite_imu_method:="2" publish_tf:=false tf_publish_rate:=0.0

      # --- [Pane 3] Static TF Tree ---
      - shell_command:
          - ros2 run tf2_ros static_transform_publisher 0.13 -0.04 0.165 0.5 0.5 0.5 0.5 base_link cam0_link & ros2 run tf2_ros static_transform_publisher -0.15 0.04 0.18 -0.35355339 0.35355339 0.61237244 -0.61237244 base_link cam1_link & ros2 run tf2_ros static_transform_publisher 0.13 0.0 0.165 -0.5 0.5 -0.5 -0.5 base_link imu_front

      # --- [Pane 4] MicroXRCE-DDS Agent ---
      - shell_command:
          - sleep 10
          - MicroXRCEAgent serial --dev /dev/ttyUSB0 -b 921600
          