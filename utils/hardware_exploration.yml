session_name: hardware_exploration
socket_name: drone_pathplanner
environment:
  ROS_DOMAIN_ID: "23"
pre_window:
windows:
- window_name: micro_ros
  layout: tiled
  panes:
    - shell_command:
        - sleep 2
        - MicroXRCEAgent serial --dev /dev/ttyUSB0 -b 921600

- window_name: drivers
  layout: tiled
  panes:
    - shell_command:
        - sleep 5
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch realsense2_camera rs_launch.py camera_name:=cam0 serial_no:="'146322110182'" enable_fisheye1:=true enable_fisheye2:=true enable_pose:=false enable_gyro:=true enable_accel:=true unite_imu_method:="2" publish_tf:=false tf_publish_rate:=0.0
    - shell_command:
        - sleep 5
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch realsense2_camera rs_launch.py camera_name:=cam1 serial_no:="'146322110430'" enable_fisheye1:=true enable_fisheye2:=true enable_pose:=false enable_gyro:=true enable_accel:=true unite_imu_method:="2" publish_tf:=false tf_publish_rate:=0.0
    - shell_command:
        - sleep 6
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 run tf2_ros static_transform_publisher 0 -0.15 -0.13 0.5 0.5 0.5 -0.5 imu base_link --ros-args -p use_sim_time:=false & ros2 run tf2_ros static_transform_publisher 0.13 0 0.16 0.5 0.5 0.5 0.5 base_link cam0_link --ros-args -p use_sim_time:=false & ros2 run tf2_ros static_transform_publisher -0.16 0 0.19 0.61237244 0.61237244 -0.35355339 0.35355339 base_link cam1_link --ros-args -p use_sim_time:=false

- window_name: algorithms
  layout: tiled
  panes:
    - shell_command:
        - sleep 10
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch openvins_bringup launch_openvins_dual.launch.py
    - shell_command:
        - sleep 12
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 run odometry_tracker odom_to_baselink --ros-args -p use_sim_time:=false & ros2 run robot_localization ekf_node --ros-args --params-file $(ros2 pkg prefix openvins_bringup)/share/openvins_bringup/config/ekf.yaml -p use_sim_time:=false
    - shell_command:
        - sleep 14
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 run odometry_tracker base_link_path_pub --ros-args -p use_sim_time:=false
    - shell_command:
        - sleep 15
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch babyk_drone_manager px4_tf_pub_hardware.launch.py

- window_name: path_planning
  layout: tiled
  panes:
    - shell_command:
        - sleep 20
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 run traj_interp trajectory_interpolator --ros-args --params-file /root/ros2_ws/src/pkg/traj_interp/config/trajectory_interpolator_flight.yaml -p use_sim_time:=false
    - shell_command:
        - sleep 21
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch babyk_drone_manager move_manager.launch.py config_file:=/root/ros2_ws/src/pkg/babyk_drone_manager/config/move_manager_params.yaml simulation:=false use_sim_time:=false
    - shell_command:
        - sleep 22
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch path_planner path_planner.launch.py config_file:=/root/ros2_ws/src/pkg/path_planner/config/path_planner_flight.yaml use_sim_time:=false
    - shell_command:
        - sleep 23
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch babyk_drone_manager tf_static_flight.launch.py use_sim_time:=false
    - shell_command:
        - sleep 24
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch vio_mapping mapper.launch.py use_sim_time:=false virtual_range:=8.0 odom_topic:=/odometry/filtered
    - shell_command:
        - sleep 25
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch babyk_drone_manager autonomous_test_node.launch.py simulation:=false use_sim_time:=false

- window_name: recovery
  layout: tiled
  panes:
    - shell_command:
        - sleep 27
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 topic echo /fsm/current_state
    - shell_command:
        - sleep 27
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 topic echo /vio_health_status
    - shell_command:
        - sleep 26
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch vio_recovery launch_recovery.launch.py use_sim_time:=false odom_topic:=/odometry/filtered

- window_name: monitoring
  layout: tiled
  panes:
    - shell_command:
        - sleep 30
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 topic echo /move_manager/status
    - shell_command:
        - sleep 30
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 topic echo /path_planner/status
    - shell_command:
        - sleep 30
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 topic echo /trajectory_interpolator/status
    - shell_command:
        - sleep 35
        - cd ~/ros2_ws && source install/setup.bash
        - python3 src/pkg/babyk_drone_manager/scripts/debug_takeoff.py --ros-args -p use_sim_time:=false
