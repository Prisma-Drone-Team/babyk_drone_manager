session_name: vins_simulation_sewer
socket_name: drone_pathplanner
environment:
  ROS_DOMAIN_ID: "56"
pre_window:
windows:
- window_name: px4
  layout: tiled
  panes:
    - shell_command:
        - cd ~/PX4_neabotics
        - PX4_GZ_MODEL=babyk_sewer PX4_GZ_WORLD=sewer PX4_GZ_MODEL_POSE="0.0,0,5.8,0,0,0" make px4_sitl gz_babyk_sewer  #HEADLESS:=1 # Sewer world: cam_down + cam_up for VIO
    - shell_command:
        - sleep 20
        - cd ~/ros2_ws && source install/setup.bash
    - shell_command:
        - sleep 20
        - cd ~/ros2_ws && source install/setup.bash
    - shell_command:
        - sleep 1
        - MicroXRCEAgent udp4 -p 8888

- window_name: utils
  layout: tiled
  panes:
    - shell_command:
        - sleep 1
        - cd ~/ros2_ws && source install/setup.bash
        # In Gazebo Harmonic, camera_info topic = /<camera_topic>/camera_info (NOT <camera_topic>_info)
        # IMU e immagini prima (critici per OpenVINS), camera_info e optional in fondo
        - ros2 run ros_gz_bridge parameter_bridge /world/sewer/model/babyk_sewer_0/link/base_link/sensor/imu_sensor/imu@sensor_msgs/msg/Imu[gz.msgs.IMU /camera_down@sensor_msgs/msg/Image[gz.msgs.Image /camera_up@sensor_msgs/msg/Image[gz.msgs.Image /clock@rosgraph_msgs/msg/Clock[gz.msgs.Clock /model/babyk_sewer_0/odometry@nav_msgs/msg/Odometry[gz.msgs.Odometry /camera_down/camera_info@sensor_msgs/msg/CameraInfo[gz.msgs.CameraInfo /camera_up/camera_info@sensor_msgs/msg/CameraInfo[gz.msgs.CameraInfo
    - shell_command:
        - sleep 2
        - cd ~/ros2_ws && source install/setup.bash
        # NOTE: imu→cam0 and imu→cam1 are published by OpenVINS from kalibr_imucam_chain.yaml
        # (publish_calibration_tf=true by default). Do NOT add duplicate static_transform_publishers
        # for these frames or TF2 will have two conflicting publishers for the same transform.

    - shell_command:
        - sleep 10
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch ov_msckf subscribe.launch.py config_path:=/root/ros2_ws/src/pkg/open_vins/config/baby_k_sewer/estimator_config.yaml max_cameras:=2 use_sim_time:=true use_approximate_sync:=true topic_camera0:=/camera_down topic_camera1:=/camera_up use_stereo:=false topic_imu:=/world/sewer/model/babyk_sewer_0/link/base_link/sensor/imu_sensor/imu verbosity:="INFO" rviz_enable:=true
    - shell_command:
        - sleep 2
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch babyk_drone_manager tf_static_sim_sewer.launch.py use_sim_time:=true
    - shell_command:
        - sleep 2
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch babyk_drone_manager px4_tf_pub_simulation.launch.py use_sim_time:=true gt_topic:=/model/babyk_sewer_0/odometry

    - shell_command:
        - sleep 3
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 run joy joy_node --ros-args -r use_sim_time:=true

- window_name: path_planning
  layout: tiled
  panes:
    - shell_command:
        - sleep 15
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 run traj_interp trajectory_interpolator --ros-args --params-file /root/ros2_ws/src/pkg/traj_interp/config/trajectory_interpolator_simulation.yaml -r use_sim_time:=true
    - shell_command:
        - sleep 16
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch babyk_drone_manager move_manager.launch.py config_file:=/root/ros2_ws/src/pkg/babyk_drone_manager/config/move_manager_simulation.yaml simulation:=true
    - shell_command:
        - sleep 17
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch path_planner path_planner.launch.py config_file:=/root/ros2_ws/src/pkg/path_planner/config/path_planner_simulation_sewer.yaml
    - shell_command:
        - sleep 12
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch vio_mapping mapper.launch.py use_sim_time:=true virtual_range:=8.0
    - shell_command:
        - sleep 25  # OpenVINS needs time to initialize static IMU before arming
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch babyk_drone_manager sewer_autonomous_test_node.launch.py simulation:=true

- window_name: monitoring
  layout: tiled
  panes:
    - shell_command:
        - sleep 20
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 topic echo /move_manager/status
    - shell_command:
        - sleep 20
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 topic echo /path_planner/status
    - shell_command:
        - sleep 20
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 topic echo /seed_pdt_drone/state

    - shell_command:
        - sleep 20
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 topic echo /trajectory_interpolator/status
    - shell_command:
        - sleep 20
        - cd ~/ros2_ws && source install/setup.bash
        - python3 src/pkg/babyk_drone_manager/scripts/debug_takeoff.py --ros-args -p use_sim_time:=true

- window_name: recovery
  layout: tiled
  panes:
    - shell_command:
        - sleep 17
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 topic echo /fsm/current_state
    - shell_command:
        - sleep 17
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 topic echo /vio_health_status
    - shell_command:
        - sleep 16
        - cd ~/ros2_ws && source install/setup.bash
        - ros2 launch vio_recovery launch_sewer_recovery.launch.py use_sim_time:=true